name: grasp

image_shape: [3, 360, 640]
mask_image_shape: [4, 360, 640]
dataset_paths:
 - /home/cwh/data/r1_pnp/zarr

shape_meta: &shape_meta
  obs:
    right_cam_img:
      shape: ${task.image_shape}
      type: rgb
      horizon: ${n_obs_steps}
    rgbm:
      shape: ${task.mask_image_shape}
      type: rgbm
      horizon: ${n_obs_steps}
    right_state:
      shape: [7]
      type: low_dim
      horizon: ${n_obs_steps}
  action:
    shape: [7]
    horizon: ${n_action_steps}

env_runner:
  _target_: controller.env_runner.real_grasp_image_runner.RealGraspImageRunner

dataset:
  _target_: controller.dataset.mask_image_dataset.MaskImageDataset
  zarr_paths: ${task.dataset_paths}
  horizon: ${n_action_steps}
  pad_before: ${eval:'${n_obs_steps}-1+${n_latency_steps}'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  val_ratio: 0
